<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 · Excel 工具箱（样式优化）</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } } } } }
</script>
<style>
  /* 统一可见焦点环：键盘可达性（WCAG 2.4.7） */
  .focusable:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #6366f1; }
  /* 表格行悬停高亮，便于逐行核对 */
  tbody tr:hover { background: #f5f6ff; }
  /* 拖拽区悬停态 */
  .drop:hover { border-color:#4f46e5; background:#eef2ff; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
<div class="mx-auto max-w-5xl p-6">
  <div class="mb-5">
    <h1 class="text-lg font-semibold">Excel 工具箱</h1>
    <p class="text-xs text-slate-500">原型（功能 4 · 样式优化）· 左侧工具栏 + 右侧工作区，动态列配置</p>
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-[200px_1fr]">
    <!-- 左侧工具栏：分组 + 激活指示条 + 悬停反馈 -->
    <aside class="rounded-xl border border-slate-200 bg-white p-2 shadow-sm">
      <div class="px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-slate-500">整理</div>
      <button class="focusable mb-0.5 flex w-full items-center gap-2 rounded-lg bg-brand-600 px-2.5 py-2 text-left text-sm font-medium text-white shadow-sm">
        <span aria-hidden="true">🔗</span> 合并 / 补全
      </button>
      <button class="focusable group mb-0.5 flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
        <span aria-hidden="true">🆕</span> 生成新表
      </button>
      <button class="focusable mb-0.5 flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
        <span aria-hidden="true">♻️</span> 去重
      </button>
      <div class="mt-2 px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-slate-500">转换</div>
      <button class="focusable mb-0.5 flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
        <span aria-hidden="true">🔄</span> 格式互转
      </button>
      <button class="focusable mb-0.5 flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
        <span aria-hidden="true">✂️</span> 按列拆分
      </button>
      <button class="focusable mb-0.5 flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
        <span aria-hidden="true">⚠️</span> 问题导出
      </button>
      <button class="focusable flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
        <span aria-hidden="true">🔍</span> 筛选导出
      </button>
    </aside>

    <!-- 右侧工作区 -->
    <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-sm font-semibold">合并 / 补全
          <span class="ml-2 rounded-md bg-brand-50 px-1.5 py-0.5 text-[10px] font-normal text-brand-700">多关键列 · 可增删</span>
        </h2>
        <div class="text-[11px] text-slate-500">订单表.xlsx + 物流表.xlsx</div>
      </div>

      <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
        <!-- 文件选择：可交互拖拽区（悬停反馈） -->
        <div>
          <label for="mainFile" class="text-[11px] font-medium text-slate-600">主表</label>
          <div id="mainFile" class="drop focusable mt-1 flex cursor-pointer items-center gap-2 rounded-lg border border-dashed border-slate-300 px-3 py-3 text-sm text-slate-600 transition" tabindex="0" role="button" aria-label="选择主表文件">
            <span aria-hidden="true" class="text-base">📄</span> 订单表.xlsx
            <span class="ml-auto text-[11px] text-brand-600">更换</span>
          </div>
          <label for="srcFile" class="mt-2 block text-[11px] font-medium text-slate-600">补全来源表</label>
          <div id="srcFile" class="drop focusable mt-1 flex cursor-pointer items-center gap-2 rounded-lg border border-dashed border-slate-300 px-3 py-3 text-sm text-slate-600 transition" tabindex="0" role="button" aria-label="选择补全来源表文件">
            <span aria-hidden="true" class="text-base">📄</span> 物流表.xlsx
            <span class="ml-auto text-[11px] text-brand-600">更换</span>
          </div>
        </div>

        <div>
          <label for="k0" class="text-[11px] font-medium text-slate-600">匹配关键列（两表对齐用，可加多列）</label>
          <div class="mt-1 space-y-1.5">
            <!-- 每行带浅底与悬停删除，↔ 居中对齐 -->
            <div class="flex items-center gap-1.5 rounded-md bg-slate-50 px-1.5 py-1">
              <select id="k0" class="focusable w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm"><option>订单号</option><option>物流单号</option></select>
              <span class="text-slate-400" aria-hidden="true">↔</span>
              <select class="focusable w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm"><option>订单号</option><option>物流单号</option></select>
              <button aria-label="删除此匹配列" class="focusable shrink-0 rounded-md px-2 py-1.5 text-sm text-rose-500 transition hover:bg-rose-50">✕</button>
            </div>
            <div class="flex items-center gap-1.5 rounded-md bg-slate-50 px-1.5 py-1">
              <select class="focusable w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm"><option>买家</option><option>手机号</option></select>
              <span class="text-slate-400" aria-hidden="true">↔</span>
              <select class="focusable w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm"><option>买家</option><option>手机号</option></select>
              <button aria-label="删除此匹配列" class="focusable shrink-0 rounded-md px-2 py-1.5 text-sm text-rose-500 transition hover:bg-rose-50">✕</button>
            </div>
            <button class="focusable mt-1 flex w-full items-center justify-center gap-1 rounded-md border border-dashed border-brand-300 px-2 py-2 text-xs font-medium text-brand-600 transition hover:bg-brand-50">
              + 添加匹配列
            </button>
          </div>

          <label for="fillField" class="mt-3 block text-[11px] font-medium text-slate-600">补全字段（来源表拉过来的列）</label>
          <div class="focusable mt-1 flex flex-wrap items-center gap-1.5 rounded-md border border-slate-200 px-2.5 py-2">
            <span class="inline-flex items-center gap-1 rounded-full bg-brand-50 px-2 py-0.5 text-xs text-brand-700">物流状态 <button aria-label="移除物流状态" class="text-brand-600 hover:text-rose-500">✕</button></span>
            <span class="inline-flex items-center gap-1 rounded-full bg-brand-50 px-2 py-0.5 text-xs text-brand-700">发货时间 <button aria-label="移除发货时间" class="text-brand-600 hover:text-rose-500">✕</button></span>
            <span class="inline-flex items-center gap-1 rounded-full bg-brand-50 px-2 py-0.5 text-xs text-brand-700">签收人 <button aria-label="移除签收人" class="text-brand-600 hover:text-rose-500">✕</button></span>
            <input id="fillField" class="w-24 flex-1 border-0 px-1 py-0.5 text-xs outline-none placeholder:text-slate-400" placeholder="+ 添加字段" />
          </div>
        </div>
      </div>

      <!-- 操作按钮：主次分明 + 统一最小高度 + 焦点环 -->
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="focusable rounded-md bg-brand-600 px-3.5 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-brand-700">预览前 20 行</button>
        <button class="focusable rounded-md border border-slate-200 px-3.5 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50">执行并下载</button>
      </div>

      <!-- 预览表：表头浅底、斑马纹、行悬停 -->
      <div class="mt-4 overflow-hidden rounded-lg border border-slate-100">
        <table class="w-full text-left text-[12px]">
          <thead class="bg-slate-100 text-slate-600"><tr><th class="px-3 py-2 font-medium">订单号</th><th class="px-3 py-2 font-medium">买家</th><th class="px-3 py-2 font-medium">物流状态</th><th class="px-3 py-2 font-medium">发货时间</th><th class="px-3 py-2 font-medium">签收人</th></tr></thead>
          <tbody class="divide-y divide-slate-100 text-slate-700">
            <tr><td class="px-3 py-2">SO2026-001</td><td class="px-3 py-2">张*</td><td class="px-3 py-2 font-medium text-emerald-600">已签收</td><td class="px-3 py-2">10-03 14:20</td><td class="px-3 py-2">张*</td></tr>
            <tr><td class="px-3 py-2">SO2026-002</td><td class="px-3 py-2">李*</td><td class="px-3 py-2 font-medium text-amber-600">运输中</td><td class="px-3 py-2">10-04 09:11</td><td class="px-3 py-2">—</td></tr>
          </tbody>
        </table>
      </div>
      <p class="mt-2 text-[11px] text-slate-500">产出：订单表_已合并.xlsx（原名不改，新文件落同目录；可多关键列 + 多补全字段）</p>
    </div>
  </div>
</div>
</body>
</html>
